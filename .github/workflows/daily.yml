name: Dagelijks

# Infrabel overschrijft het dagbestand elke ochtend. We halen het twee keer per
# dag op: een gemiste dag is anders weg tot het maandbestand verschijnt.
# Dubbel ophalen is onschuldig: dezelfde dag overschrijft hetzelfde bestand.
on:
  schedule:
    - cron: "17 7 * * *"   # 08:17 / 09:17 in België
    - cron: "43 16 * * *"  # vangnet
  workflow_dispatch:

permissions:
  contents: write   # releases + history/national.json
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      STIPT_STORAGE: github
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Dagbestand ophalen
        run: python -m stipt ingest-daily

      - name: Nieuwe maandbestanden verwerken
        run: python -m stipt ingest-monthly --since "$(date -d '-3 months' +%Y-%m)"

      - name: Website-data bouwen
        run: python -m stipt build --months 13

      - name: Vergelijken met Infrabel
        run: python -m stipt validate >> "$GITHUB_STEP_SUMMARY"

      - name: Maandcijfers bewaren
        run: |
          git config user.name "stipt-bot"
          git config user.email "stipt-bot@users.noreply.github.com"
          [ -f history/national.json ] || exit 0
          git add history/national.json
          if ! git diff --cached --quiet; then
            git commit -m "Maandcijfers bijgewerkt"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: pipeline
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
